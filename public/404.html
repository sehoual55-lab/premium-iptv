*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:linear-gradient(180deg,#f6faff,#fff 60%);
color:var(--text);font-family:var(--font);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
svg{display:block}

.logo__mark svg{width:19px;height:19px}
.logo b{color:var(--acc)}
main{flex:1;display:grid;place-items:center;padding:60px 22px 80px;text-align:center}
.box{max-width:560px;display:flex;flex-direction:column;align-items:center;gap:18px}
.code{font-size:clamp(4.5rem,16vw,8rem);font-weight:800;letter-spacing:-.05em;line-height:.9;
background:linear-gradient(100deg,var(--acc) 20%,#7cb8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
h1{margin:0;font-size:clamp(1.4rem,4vw,2rem);letter-spacing:-.02em}
p{margin:0;color:var(--muted)}
.btns{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:14px 26px;border-radius:12px;
font-weight:600;font-size:.95rem;border:1px solid transparent;transition:transform .18s,background .2s,border-color .2s,box-shadow .25s}
.btn:hover{transform:translateY(-2px)}
.btn--p{background:var(--acc);color:#fff;box-shadow:0 10px 26px -12px rgba(22,104,227,.9)}
.btn--p:hover{background:#0f57c8}
.btn--g{background:#fff;border-color:var(--line-2)}
.btn--g:hover{border-color:var(--acc);color:var(--acc);background:var(--acc-tint)}
.btn--g svg{width:17px;height:17px;color:#25a05a}
.links{display:flex;flex-wrap:wrap;gap:8px 22px;justify-content:center;margin-top:22px;font-size:.9rem}
.links a{color:var(--muted);border-bottom:1px solid transparent;transition:color .2s,border-color .2s}
.links a:hover{color:var(--acc);border-color:var(--acc)}
footer{border-top:1px solid var(--line);padding:22px;text-align:center;color:#8093a8;font-size:.82rem}
@media(max-width:520px){.btns .btn{flex:1 1 100%}}
</style>
